<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Lootbox Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI",system-ui,sans-serif}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0;transform:scale(.6);transition:opacity .4s,transform .4s}
.card.show{opacity:1;transform:scale(1)}
.box{font-size:140px;line-height:1;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.shake{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.emote{width:224px;height:224px;object-fit:contain;padding:24px;border-radius:24px;background:rgba(15,15,25,.85);border:4px solid var(--c);box-shadow:0 0 40px 8px var(--c)}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.text{background:rgba(15,15,25,.85);color:#fff;padding:10px 22px;border-radius:14px;text-align:center;font-size:26px;font-weight:700;text-shadow:0 2px 4px #000}
.rarity{color:var(--c);font-size:20px;letter-spacing:2px;text-transform:uppercase}
.neu{color:#facc15}
</style></head>
<body><div id="stage"></div>
<script>
const WS_URL = "ws://127.0.0.1:8080/";
const COLORS = {common:"#9ca3af", rare:"#3b82f6", epic:"#a855f7", legendary:"#f59e0b", mythic:"#ff2e63"};
const queue = []; let busy = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function connect() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => ws.send(JSON.stringify({request:"Subscribe", id:"lootbox", events:{General:["Custom"]}}));
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    const d = m && m.lootbox ? m : (m && m.data && m.data.lootbox ? m.data : null);
    if (d) { queue.push(d); next(); }
  };
  ws.onclose = () => setTimeout(connect, 3000);
}

async function next() {
  if (busy || !queue.length) return;
  busy = true; await play(queue.shift()); busy = false; next();
}

async function play(d) {
  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--c", COLORS[d.rarity] || "#fff");
  card.innerHTML = `<div class="box shake">🎁</div><div class="text">${esc(d.user)} öffnet eine Lootbox…</div>`;
  document.getElementById("stage").appendChild(card);
  await wait(50); card.classList.add("show"); await wait(2200);
  const tag = d.amount == 1 ? '<span class="neu">NEU!</span>' : `x${d.amount}`;
  card.innerHTML = `<img class="emote pop" src="${encodeURI(d.file)}">
    <div class="text"><div class="rarity">${esc(d.label)}</div>${esc(d.name)} · ${tag}</div>`;
  await wait(5000); card.classList.remove("show"); await wait(500); card.remove();
}
connect();
</script></body></html>
